name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firstman_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/firstman_crm
      BETTER_AUTH_SECRET: ci-only-secret-do-not-use-in-prod-please
      BETTER_AUTH_URL: http://localhost:3100
      ADMIN_DEFAULT_PASSWORD: ChangeMe123!
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: "FirstMan Corporate Services <no-reply@firstman.in>"
      ENQUIRIES_API_TOKEN: ci-only-enquiries-token-do-not-use-in-prod
      STORAGE_DRIVER: local
      TZ_DISPLAY: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Unit tests
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t firstman-crm:${{ github.ref_name }} .

      # Push + Coolify webhook trigger are wired up once registry credentials
      # and the Coolify deploy webhook URL are added as repo secrets.
